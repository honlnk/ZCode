name: Build Android APK

# 触发：
# 1. push 到 android-build 分支且安卓包相关路径有改动（施工期验证）。
# 2. push android-* tag：构建后创建 GitHub Release 并把 APK 挂为资产，手机可直接下载。
# 3. workflow_dispatch：该文件进入默认分支后可用于手动触发；分支上先用 push 触发。
on:
  push:
    branches:
      - android-build
    paths:
      - 'packages/android/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'android-*'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag 构建时创建 Release / 上传资产需要写权限
    defaults:
      run:
        working-directory: packages/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 只取安卓包和 workflow 文件，避免拉取整个 monorepo
          sparse-checkout: |
            packages/android
            .github
          sparse-checkout-cone-mode: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像已预装 Android SDK 与 cmdline-tools，直接补装所需的 platform/build-tools。
      # 不用 android-actions/setup-android：其 v3 会尝试安装已下线的 legacy tools 包而失败。
      - name: Install SDK platform and build tools
        run: |
          if ! command -v sdkmanager > /dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36.1" "build-tools;36.1.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zcode-android-release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/zcode-android-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/apk/zcode-android-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: zcode-android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/android-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/apk/*.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/apk/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZCode Android $GITHUB_REF_NAME" \
              --notes "Built from packages/android at $GITHUB_SHA"
          fi
